command:
  - uvicorn
  - app.serve:app
  - --host
  - 0.0.0.0
  - --port
  # Databricks Apps substitutes DATABRICKS_APP_PORT with the real port at runtime;
  # the front door routes there (hardcoding 8080 caused a 502 upstream mismatch).
  - "$DATABRICKS_APP_PORT"

env:
  # UC location for the kit's Delta tables + config file path.
  - name: TIERS_CONFIG
    value: "config/tiers.yaml"
  # SQL warehouse used to read system tables and write approvals/audit.
  - name: WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  # Account SCIM: tier groups are account groups, so membership is managed via the
  # account API using a dedicated account SP (creds from the uag-budget secret scope).
  - name: DATABRICKS_ACCOUNT_ID
    value: "<your-databricks-account-id>"
  - name: ACCOUNT_HOST
    value: "https://accounts.azuredatabricks.net"
  - name: ACCOUNT_SP_SECRET_SCOPE
    value: "uag-budget"
  # Public URL of this app, used in notifications + links. Set to your app's URL.
  - name: APP_URL
    value: "<your-app-url>"
  - name: CONSOLE_URL
    value: ""
  # Slack channels (ids) for notifications. Bot token from SLACK_BOT_TOKEN or the
  # 'slack_bot_token' key in the uag-budget scope. Empty -> in-app only (Slack logged).
  - name: SLACK_CHANNEL_USER
    value: ""
  - name: SLACK_CHANNEL_STEWARD
    value: ""
